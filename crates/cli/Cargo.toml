[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tracery-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.9", features = ["derive"] }
engine = { version = "0.1.0", path = "../engine" }
geom = { version = "0.1.0", path = "../geom" }
io = { version = "0.1.0", path = "../io" }
motifs = { version = "0.1.0", path = "../motifs" }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
