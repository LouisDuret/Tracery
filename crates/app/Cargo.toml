[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tracery"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.37.0", features = ["wgpu"] }
egui = "0.37"
engine = { version = "0.1.0", path = "../engine" }
geom = { version = "0.1.0", path = "../geom" }
io = { version = "0.1.0", path = "../io" }
motifs = { version = "0.1.0", path = "../motifs" }
rayon = "1.12.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny-skia = "0.12"
