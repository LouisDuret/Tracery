name: CI
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --release --workspace --all-targets -- -D warnings
      # inclut les seeds dorées : vérifie le déterminisme multi-plateforme (ADR-05)
      - run: cargo test --release --workspace
      - run: cargo run --release -p cli -- validate --shapes all --styles all --seeds 0..19 --determinism
